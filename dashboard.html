<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Sederhana</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Dashboard</div>
    <nav class="topnav">
      <a href="index.html">Home</a>
      <a href="tentang.html">Tentang</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <ul>
        <li class="active">Overview</li>
        <li>Stats</li>
        <li>Users</li>
        <li>Settings</li>
      </ul>
    </aside>

    <main class="main">
      <section class="cards">
        <div class="card">
          <h3>Users</h3>
          <p class="big">1,234</p>
        </div>
        <div class="card">
          <h3>Active</h3>
          <p class="big">87%</p>
        </div>
        <div class="card">
          <h3>Sales</h3>
          <p class="big">₿ 3.2k</p>
        </div>
      </section>

      <section class="panel">
        <h2>Recent Activity</h2>
        <table>
          <thead>
            <tr><th>Waktu</th><th>Kegiatan</th><th>User</th></tr>
          </thead>
          <tbody>
            <tr><td>10:12</td><td>Login</td><td>Ani</td></tr>
            <tr><td>09:55</td><td>Upload file</td><td>Budi</td></tr>
            <tr><td>08:30</td><td>Update profil</td><td>Clara</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <footer class="footer">© 2026 Contoh Dashboard</footer>
</body>
</html>
